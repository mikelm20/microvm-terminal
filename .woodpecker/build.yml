# Build-only pipeline. Fires on tags matching *-build.
# Produces <registry>/learn-landing:<version>.<pipeline>
# without touching the deploy repo. Useful for testing the image before
# a real prod tag.

when:
  event: tag

steps:
  - name: build
    image: woodpeckerci/plugin-docker-buildx
    when:
      evaluate: 'CI_COMMIT_TAG matches ".*-build$"'
    settings:
      repo: <registry>/learn-landing
      registry: <registry>
      context: ./web
      dockerfile: ./web/Dockerfile
      tags:
        - "${CI_COMMIT_TAG%-*}.${CI_PIPELINE_NUMBER}"
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
