# Prod deploy pipeline. Fires on tags matching *-prod.
# Builds + pushes the image, then bumps LEARN_LANDING_VERSION in the
# devops-deploy repo so Komodo picks it up and redeploys Traefik's
# routed stack on core-01.

when:
  event: tag

steps:
  - name: check
    image: node:22-alpine
    when:
      evaluate: 'CI_COMMIT_TAG matches ".*-prod$"'
    commands:
      - cd web
      - npm ci --no-audit --no-fund
      - npx tsc --noEmit

  - name: build
    image: woodpeckerci/plugin-docker-buildx
    when:
      evaluate: 'CI_COMMIT_TAG matches ".*-prod$"'
    depends_on:
      - check
    settings:
      repo: <registry>/learn-landing
      registry: <registry>
      context: ./web
      dockerfile: ./web/Dockerfile
      tags:
        - "${CI_COMMIT_TAG%-*}.${CI_PIPELINE_NUMBER}"
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

  - name: update-deploy-repo
    image: alpine/git
    when:
      evaluate: 'CI_COMMIT_TAG matches ".*-prod$"'
    depends_on:
      - build
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - VERSION=$(echo $CI_COMMIT_TAG | sed 's/-prod$//').${CI_PIPELINE_NUMBER}
      - git clone https://x-access-token:$GITHUB_TOKEN@github.com/<private-repo>.git /tmp/deploy
      - cd /tmp/deploy
      - sed -i "s/^LEARN_LANDING_VERSION=.*/LEARN_LANDING_VERSION=$VERSION/" config.prod.env
      - git config user.email "ops@example.com"
      - git config user.name "Woodpecker CI"
      - git add -A
      - git diff --cached --quiet || git commit -m "learn-landing prod $VERSION"
      - git push origin main
