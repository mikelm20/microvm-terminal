# Local dev stack: Postgres 16 for the control plane to talk to. The control
# plane itself runs on the host with `go run` against DATABASE_URL.
#
# Usage:
#   make dev-up     # start services
#   make dev-down   # stop and remove
#   make dev-logs   # follow logs
#   make psql       # psql shell into the dev db
#
# Credentials live in `.env.local` at repo root (gitignored). See
# `.env.local.example` for the expected variables.

name: microvm-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: microvm-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-microvm}
      POSTGRES_USER: ${PG_USER:-microvm}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-microvm}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-microvm} -d ${PG_DB:-microvm}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
