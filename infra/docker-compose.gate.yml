# Proxy rehearsal stack: the optional Anthropic proxy + an nftables-like
# container policy + an Anthropic mock + a VM simulator. Run with
# `infra/gate-smoke.sh` from the repo root.
#
# Why docker and not the real Firecracker path?
#   - It runs on macOS laptops; Firecracker needs KVM which is Linux-only.
#   - jailer.sh is exercised by `make integration-vm` on a real host.
#   - What this stack tests: HTTP surface of the proxy, quota, audit to
#     Postgres, and the allowlist behaviour of vm-sim.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: microvm
      POSTGRES_PASSWORD: microvm
      POSTGRES_DB: microvm
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microvm -d microvm"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      internal: {}

  # Stands in for api.anthropic.com. Returns fixed JSON bodies with usage
  # metrics the proxy should record. Using kennethreitz/httpbin keeps the
  # image tiny and the contract obvious.
  fake-anthropic:
    image: ghcr.io/nginx/nginx-unprivileged:1.27-alpine
    volumes:
      - ./fake-anthropic/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fake-anthropic/messages.json:/usr/share/nginx/html/v1/messages:ro
    ports:
      - "18080:8080"
    networks:
      internal: {}

  claude-proxy:
    build:
      context: ../proxy
      dockerfile: Dockerfile
    environment:
      ANTHROPIC_API_KEYS: |
        [{"id":"dev-k1","workspace":"dev","secret":"sk-ant-fake-DEV-DO-NOT-USE"}]
      POSTGRES_URL: postgres://microvm:microvm@postgres:5432/microvm?sslmode=disable
      # Placeholder, never a real secret. The real admin token lives in
      # /etc/microvm-terminal/proxy.env on the host.
      PROXY_ADMIN_TOKEN: CHANGEME_LOCAL_DEV_ONLY
      PROXY_UPSTREAM: http://fake-anthropic:8080
    command:
      - "--plain"
      - "--listen"
      - ":8443"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Only exposed on loopback so curl tests from the host can poke it.
      - "127.0.0.1:18443:8443"
    networks:
      internal: {}

  # vm-sim mimics the network policy a jailed VM sees. The production version
  # is enforced by nftables on fc-br0; here we approximate it with a small
  # iptables ruleset applied at container start. Every test assertion hits
  # `docker compose exec vm-sim curl ...`.
  vm-sim:
    image: alpine:3.20
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - claude-proxy
    volumes:
      - ./vm-sim/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["sleep", "infinity"]
    networks:
      internal: {}

networks:
  internal:
    driver: bridge
