server {
  listen       8080;
  server_name  _;

  # Exact-match the endpoint Claude Code hits.
  location = /v1/messages {
    default_type application/json;
    add_header X-Upstream "fake-anthropic" always;
    alias /usr/share/nginx/html/v1/messages;
    try_files "" =200;
  }

  location / {
    default_type application/json;
    return 404 '{"error":"not found"}';
  }
}
