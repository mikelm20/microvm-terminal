<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>microVM terminal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --card: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.12);
    --fg: #e8e8e8;
    --muted: rgba(232, 232, 232, 0.6);
    --accent: #4f8cff;
    --accent-deep: #3a6fd6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, "Cascadia Code", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
  }
  .wrap { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
  .tag {
    align-self: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 24px 22px;
  }
  h1 { margin: 0 0 6px; font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .sub { margin: 0 0 18px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 11px 13px;
    background: rgba(0, 0, 0, 0.4);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14.5px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 13px 18px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-deep); }
  .err {
    margin-top: 14px;
    padding: 9px 12px;
    border: 1px solid rgba(255, 99, 71, 0.5);
    background: rgba(255, 99, 71, 0.12);
    color: #ffb4a3;
    font-size: 12.5px;
    border-radius: 10px;
  }
  .hint { margin-top: 14px; text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">microVM terminal</span>
  <form class="card" method="post" action="/login">
    <h1>Claude Code</h1>
    <p class="sub">Each login boots a fresh Firecracker microVM with Claude Code inside. The VM is yours until you close it or it sits idle.</p>

    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="username" required value="{{.Name}}" autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

    <button type="submit">Open terminal</button>

    <div class="hint">Your name only labels the VM. Nothing inside it survives the VM.</div>
  </form>
</div>
</body>
</html>
