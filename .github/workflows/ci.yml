name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (build, vet, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            control-plane/go.sum
            guest-agent/go.sum
            proxy/go.sum

      - name: control-plane
        working-directory: control-plane
        run: go build ./... && go vet ./... && go test ./...

      - name: guest-agent
        working-directory: guest-agent
        run: make build && GOOS=linux GOARCH=amd64 go vet ./... && go test ./...

      - name: proxy
        working-directory: proxy
        run: go build ./... && go vet ./... && go test ./...
