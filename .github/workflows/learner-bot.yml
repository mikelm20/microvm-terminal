name: learner-bot

# Offline replay of the captured stream-json fixtures (tests/fixtures/claude)
# through the real claude-wrap parser and the control-plane predicate
# evaluator. Needs no VM, no KVM and no Claude token, so it runs on a plain
# runner. The live-Claude variant sits behind the `integration` build tag and
# is intentionally not run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: learner-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learner-bot:
    name: learner-bot (offline fixture replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            tests/learner-bot/go.sum
            control-plane/go.sum

      - name: Offline replay
        working-directory: tests/learner-bot
        run: go test -count=1 ./...
