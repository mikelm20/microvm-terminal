# Fase 2, Pillar 2 Context, Lesson 1. EN.

id: p2-contexto-01-ventana
module_number: 201
language: en
title: See your context window fill up
subtitle: The counter that decides how much Claude can remember
description: >
  Every conversation has finite space. More files read, more turns,
  fuller it gets. The exact number is not the point. The point is
  you know it is there and you mind it. Today you see it live.
estimated_minutes: 6
sandbox: empresa-prueba
mental_model: >
  The context window is the desk. Anything you want Claude to see
  goes on top. The desk is wide but not infinite. When it fills,
  you tidy up.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: status-inicial
    title: See the empty window
    body: >
      We start by checking the state before loading anything.
      /status shows a low context percentage because the chat just
      started. Note the number, you will watch it.
    prompt: |
      /status
    hint: >
      Trick: in /status, find the "context" line with a percentage.
      That is the counter.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: status
    success_title: "Nice. You know your starting point"
    success_sub: "You earn 10 XP. Now let us mess up the desk on purpose."

  - id: cargar-departamentos
    title: Load several files into the conversation
    body: >
      Ask Claude to read three teams in a row. Each read takes
      space in the window. You will see each Read add up.
    prompt: |
      read 01-ventas, 02-marketing and 03-tecnologia and give me a one-sentence summary of each
    hint: >
      Trick: three is enough to feel it. With eight you would see
      the window quite full, but you will find that out by yourself.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "(01-ventas|02-marketing|03-tecnologia)"
    success_title: "Nice. Three teams loaded"
    success_sub: "You earn 10 XP. Time to check the counter again."

  - id: status-despues
    title: Check the window after
    body: >
      Run /status again. The percentage went up. That is what we
      wanted you to see: each action consumes. Do not panic about
      the number, just notice it moves.
    prompt: |
      /status
    hint: >
      Trick: a small jump means your chat is light. A big jump
      after few files means those files are big. Size matters,
      not just count.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: status
    success_title: "Nice. You saw the counter climb"
    success_sub: "You earn 10 XP. Half the pillar done: context gets spent."

  - id: reflexion-ligera
    title: Ask what takes the most room
    body: >
      Concept wrap-up. Ask Claude what fills the window the most
      in general: code, long files, logs. Builds the intuition.
    prompt: |
      in general, what fills the context window the most when you work with me?
    hint: >
      Trick: the answer will serve you the rest of the pillar.
      Likely "big files, long histories, command logs". Keep that.
    xp: 10
    expected_response_seconds: 20
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(context|window|fills|takes)"
    success_title: "Nice. You get what context is"
    success_sub: "You earn 10 XP. Next lesson: tidy the desk without losing the thread."

on_complete:
  total_xp: 40
  takeaways:
    - The context window is finite and visible via /status.
    - Each file read and each turn adds to the counter.
    - Big files weigh more than short turns.
  next_module: p2-contexto-02-clear-compact
