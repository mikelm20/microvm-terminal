# Fase 2, Pillar 3 Prompting, Lesson 1. EN.

id: p3-prompting-01-contexto-objetivo-tono
module_number: 301
language: en
title: The golden rule
subtitle: Context, goal, tone in every request
description: >
  Google searches. Claude understands. The cleaner the ask, the
  better the answer. Three ingredients every time: context (what
  this is about), goal (what you want), tone (how it should be
  written). You drill it three times today.
estimated_minutes: 7
sandbox: empresa-prueba
mental_model: >
  A good prompt is not longer, it is better structured. The three
  by three: I set context, I state the goal, I ask for tone. In
  that order.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: solo-objetivo
    title: Send the short, goal-only version
    body: >
      We start with the most common and worst pattern. A question
      with no context, no tone, just the goal. You will see the
      reply to compare later.
    prompt: |
      give me three ideas for the board
    hint: >
      Trick: observe how the reply looks. Generic, probably long,
      no reference to your case. That is what we are going to
      improve.
    xp: 10
    expected_response_seconds: 20
    success:
      type: claude_prompt_sent
      match_regex: "(?i)three\\s+ideas|ideas\\s+for"
    success_title: "Nice. You have the weak baseline"
    success_sub: "You earn 10 XP. Now add context and watch the change."

  - id: con-contexto
    title: Add context, ask again
    body: >
      Same goal, but now with context: where to pull info from.
      Notice the difference: instead of generic, Claude reads
      files and proposes ideas anchored in your company.
    prompt: |
      context: i work at empresa prueba, the root CLAUDE.md already states my priorities. Goal: give me three concrete ideas for my slot at the quarterly board. Read 05-finanzas and 08-estrategia before answering.
    hint: >
      Trick: context does not have to be long. Two sentences and
      the paths of the files are enough for Claude to stop guessing.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "(05-finanzas|08-estrategia)"
    success_title: "Nice. The reply is anchored in your company"
    success_sub: "You earn 10 XP. Tone is missing, the piece no one asks for."

  - id: con-tono
    title: Add tone and ask once more
    body: >
      Last ingredient. You tell it HOW to write. This is the one
      almost nobody asks for and the one that moves the answer
      the most. Rewrite the prompt adding the tone you like.
    prompt: |
      same context and goal, but write it as three one-line bullets, executive tone, no empty adjectives, with a number in each idea
    hint: >
      Trick: tone is not literary style, it is operational
      constraints. "One-line bullets" is tone. "With a number" is
      tone. "No empty adjectives" is tone.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(bullets|tone|executive|number|adjectives)"
    success_title: "Nice. Full three-by-three delivered"
    success_sub: "You earn 10 XP. From today, no prompt without the three ingredients."

  - id: reformular-libre
    title: Your turn, from scratch
    body: >
      Write a prompt you would use in your real work. Apply the
      three ingredients: context, goal, tone. No template, no
      copy. This is where you start composing free.
    hint: >
      Trick: if unsure, think of it as an email to a sharp
      intern. "This is about X. I want Y. Write it like this."
    xp: 10
    expected_response_seconds: 90
    success:
      type: claude_prompt_sent
    success_title: "Nice. First free prompt with the three-by-three"
    success_sub: "You earn 10 XP. The golden rule is yours. Next: make it even better with examples."

on_complete:
  total_xp: 40
  takeaways:
    - Context, goal, and tone in every request.
    - Context = where to pull info; goal = what you want; tone = how to write.
    - Tone is operational constraint, not literary style.
  next_module: p3-prompting-02-ejemplos-y-critica
