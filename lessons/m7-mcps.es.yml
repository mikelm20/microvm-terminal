# Modulo 7, MCPs. Version ES.
#
# Comando canonico:
#   claude mcp add <name> <launch-config>
#
# Predicados:
#   - claude_slash_command: { command: "mcp" }
#   - claude_tool_call:     { tool: Bash, command_regex: "claude\\s+mcp\\s+add" }
#   - claude_prompt_sent:   { match_regex }

id: m7-mcps
module_number: 7
language: es
title: MCPs
subtitle: Conectar Claude con tus herramientas reales
description: >
  Hasta ahora Claude vivia dentro de tu carpeta. Un MCP (Model
  Context Protocol) es un enchufe estandar para darle acceso a
  herramientas: el sistema de archivos, GitHub, Gmail, Drive,
  Slack. Pasa de leer a hacer.
estimated_minutes: 9
sandbox: empresa-prueba
mental_model: >
  Sin MCP, Claude te dice "deberias mandar este email". Con MCP,
  lo manda. Sin MCP, "tienes hueco el martes". Con MCP, agenda la
  reunion.

preconditions:
  working_directory: /home/learner/empresa-prueba/mi-trabajo
  claude_running: true

steps:

  - id: ver-mcps-actuales
    title: Mira que MCPs tienes ya
    body: >
      Como con /agents y /skills, hay un comando para ver el
      estado. /mcp te lista los servidores MCP activos en este
      proyecto y a nivel usuario.
    prompt: |
      /mcp
    hint: >
      Truco: /mcp tambien te permite gestionar autenticaciones de
      MCPs ya conectados.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: mcp
    success_title: "Bien. Inventario hecho"
    success_sub: "Ganas 10 XP. Vamos a enchufar el primero."

  - id: anadir-filesystem-mcp
    title: Conecta el MCP de filesystem
    body: >
      Es el mas simple de probar y no necesita credenciales. Con
      el, Claude puede leer y editar archivos fuera de
      ~/empresa-prueba si los autorizas.
    prompt: |
      anademe un MCP de filesystem usando npx
      @anthropic-ai/build-mcp-server-filesystem y dale acceso a
      la carpeta ~/empresa-prueba/mi-trabajo
    hint: >
      Truco: la primera vez que un MCP intenta una accion sensible,
      Claude te pide confirmacion en pantalla.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Bash
        command_regex: "claude\\s+mcp\\s+add.*filesystem"
    success_title: "Bien. El primer enchufe esta puesto"
    success_sub: "Ganas 10 XP. Pruebalo en el siguiente paso."

  - id: usar-filesystem-mcp
    title: Usalo
    body: >
      Una vez enchufado, no tienes que hacer nada distinto en
      tus prompts. Claude detecta el MCP y lo usa cuando
      conviene.
    prompt: |
      usando el MCP de filesystem, listame todos los archivos
      de mi-trabajo y dime cuales he modificado en los ultimos
      siete dias
    hint: >
      Truco: si dudas si Claude esta usando el MCP o sus tools
      internas, pregunta "que herramienta has usado y por que?".
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(filesystem|mcp).{0,60}(listame|listar|archivos)"
    success_title: "Bien. Has hecho tu primera accion via MCP"
    success_sub: "Ganas 10 XP. Ultimo paso, importante."
    role_variants:
      ventas:
        body: "Sugerencia: luego piensa en un MCP de CRM para automatizar contactos."
      marketing:
        body: "Sugerencia: luego piensa en un MCP de LinkedIn o tu CMS para publicar."
      tecnologia:
        body: "Sugerencia: luego piensa en MCPs de GitHub y Sentry para issues reales."
      producto:
        body: "Sugerencia: luego piensa en MCPs de tu analitica y tu tracker."
      finanzas:
        body: "Sugerencia: luego piensa en MCPs de tu banca y tu ERP."
      rrhh:
        body: "Sugerencia: luego piensa en MCPs de tu ATS y nomina (con permisos)."
      legal:
        body: "Sugerencia: luego piensa en MCPs de gestor documental (con permisos)."
      estrategia:
        body: "Sugerencia: luego piensa en MCPs de CRM ejecutivo y boardroom."

  - id: limites-y-permiso
    title: La regla de oro de los MCPs
    body: >
      Los MCPs interesantes (Gmail, Drive, banco) abren la puerta
      a acciones sensibles: enviar emails, transferir, borrar.
      Antes de cualquiera de esas, Claude te pide confirmacion.
    prompt: >
      explicame en tres frases que pasaria si conectara un MCP
      de Gmail y te pidiera "responde a Pedro y agenda la
      reunion". Que harias tu y que me preguntarias antes?
    hint: >
      Truco: si un MCP intenta una accion sin pedirte confirmacion,
      ese MCP esta mal configurado.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(gmail|confirmacion|permiso|preguntaria)"
    success_title: "Bien. Has cerrado el modulo entendiendo el limite"
    success_sub: "Ganas 10 XP. Modulo 7 cerrado."

on_complete:
  total_xp: 40
  takeaways:
    - MCP = enchufe estandar entre Claude y otras herramientas.
    - Se anade con `claude mcp add <nombre> <config>`.
    - Filesystem es el primer paso seguro, sin credenciales.
    - Acciones sensibles SIEMPRE piden confirmacion. Tu mandas.
  next_module: m8-vida-ai-native
  trigger_signup: false
