# Module 7, MCPs. EN version.

id: m7-mcps
module_number: 7
language: en
title: MCPs
subtitle: Connect Claude to your real tools
description: >
  So far Claude lived inside your folder. An MCP (Model Context
  Protocol) is a standard plug that gives it access to tools: the
  filesystem, GitHub, Gmail, Drive, Slack. Read to do.
estimated_minutes: 9
sandbox: empresa-prueba
mental_model: >
  Without MCP, Claude says "you should send this email". With MCP,
  it sends it. Without MCP, "you have time Tuesday". With MCP, it
  books the meeting.

preconditions:
  working_directory: /home/learner/empresa-prueba/mi-trabajo
  claude_running: true

steps:

  - id: ver-mcps-actuales
    title: See what MCPs you have
    body: >
      Like /agents and /skills, there's a command to check state.
      /mcp lists the active MCP servers in this project and at
      user level.
    prompt: |
      /mcp
    hint: >
      Trick: /mcp also lets you manage authentication for already
      connected MCPs.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: mcp
    success_title: "Nice. Inventory done"
    success_sub: "You earned 10 XP. Let's plug the first one."

  - id: anadir-filesystem-mcp
    title: Connect the filesystem MCP
    body: >
      Simplest to try, no credentials needed. With it, Claude can
      read and edit files outside ~/empresa-prueba if you allow it.
    prompt: |
      add a filesystem MCP using npx
      @anthropic-ai/build-mcp-server-filesystem and give it
      access to the folder ~/empresa-prueba/mi-trabajo
    hint: >
      Trick: the first time an MCP tries a sensitive action, Claude
      asks for confirmation on screen.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Bash
        command_regex: "claude\\s+mcp\\s+add.*filesystem"
    success_title: "Nice. First plug in place"
    success_sub: "You earned 10 XP. Try it in the next step."

  - id: usar-filesystem-mcp
    title: Use it
    body: >
      Once plugged in, nothing changes in your prompts. Claude
      detects the MCP and uses it when relevant.
    prompt: |
      using the filesystem MCP, list all files in mi-trabajo and
      tell me which I've modified in the last seven days
    hint: >
      Trick: if you're not sure if Claude is using the MCP or its
      internal tools, ask "which tool did you use and why?".
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(filesystem|mcp).{0,60}(list|files)"
    success_title: "Nice. First action via MCP"
    success_sub: "You earned 10 XP. One important last step."
    role_variants:
      ventas:
        body: Next, think about a CRM MCP to automate contacts.
      marketing:
        body: Next, think about LinkedIn or your CMS MCP to publish.
      tecnologia:
        body: Next, think about GitHub and Sentry MCPs for real issues.
      producto:
        body: Next, think about MCPs for your analytics and tracker.
      finanzas:
        body: Next, think about MCPs for your bank and ERP.
      rrhh:
        body: Next, think about MCPs for your ATS and payroll (with permissions).
      legal:
        body: Next, think about doc management MCPs (with permissions).
      estrategia:
        body: Next, think about executive CRM and boardroom MCPs.

  - id: limites-y-permiso
    title: The golden rule of MCPs
    body: >
      Interesting MCPs (Gmail, Drive, banking) open the door to
      sensitive actions: send emails, transfer, delete. Before any
      of those, Claude asks confirmation.
    prompt: >
      explain in three sentences what would happen if I connected
      a Gmail MCP and asked you "reply to Peter and schedule the
      meeting". What would you do and what would you ask me
      first?
    hint: >
      Trick: if an MCP tries a sensitive action without asking for
      confirmation, that MCP is misconfigured.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(gmail|confirmation|permission|ask)"
    success_title: "Nice. You closed the module understanding the limit"
    success_sub: "You earned 10 XP. Module 7 closed."

on_complete:
  total_xp: 40
  takeaways:
    - MCP = standard plug between Claude and other tools.
    - Added with `claude mcp add <name> <config>`.
    - Filesystem is the safe first step, no credentials.
    - Sensitive actions ALWAYS ask for confirmation. You are in charge.
  next_module: m8-vida-ai-native
  trigger_signup: false
