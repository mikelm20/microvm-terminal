# Module 4, Day to day. EN version.

id: m4-dia-a-dia
module_number: 4
language: en
title: Day to day
subtitle: Morning brief, pre-meeting briefs, logging, end of day
description: >
  Four habits that change how you start and end the day. We start
  with the first question of the morning and end with the last of
  the afternoon.
estimated_minutes: 9
sandbox: empresa-prueba
mental_model: >
  This isn't just another app. It's your desk. Coffee, Claude,
  first question of the day. Everything else flows through here.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true
  files_present:
    - 00-bandeja/calendario.md
    - 00-bandeja/inbox/

steps:

  - id: parte-matinal
    title: Ask for the daily brief
    body: >
      First question of the morning, always the same. Meetings,
      urgent emails, what you left open yesterday. Three blocks
      under a minute.
    prompt: |
      Give me the daily brief. Meetings, urgent emails, and
      anything we left open yesterday. Short, three blocks.
    hint: >
      Trick: if you ask the same way every day, tomorrow you turn
      it into a skill (module 6) and copy paste is gone.
    xp: 10
    expected_response_seconds: 60
    voice_first: true
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "(00-bandeja|calendario|inbox)"
    success_title: "Nice. You have the day on one screen"
    success_sub: "You earned 10 XP. Next up: the pre-meeting brief."

  - id: brief-pre-reunion
    title: Brief before a meeting
    body: >
      Two minutes before any meeting, instant brief. Who they are,
      last contact, open commitments, three topics to cover. Your
      sandbox has people in 01-personas/.
    prompt: |
      I have a meeting with Marta in ten minutes. Give me the
      last thing we talked about, open commitments, and three
      things I should cover today.
    hint: >
      Trick: don't ask "prep the meeting". Ask for the specific
      pieces. That way the answer is actionable, not a speech.
    xp: 10
    expected_response_seconds: 60
    voice_first: true
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "01-personas/(marta|andrea|lucia|cristina|carmen|pablo|maya|ashley|lucy|christine|caroline|peter)"
    success_title: "Nice. You're ready for the meeting"
    success_sub: "You earned 10 XP. What matters is what happens after."
    role_variants:
      ventas:
        body: >
          You meet with Marta (she leads your team). Ask Claude
          for last contact, open commitments, three topics.
        prompt: |
          I have a meeting with Marta in ten minutes. Give me last
          contact, open commitments, and three things I should
          cover today.
      marketing:
        body: >
          You meet with Lucia (marketing). Ask Claude for last
          contact, open commitments, three topics.
        prompt: |
          I have a meeting with Lucia in ten minutes. Give me last
          contact, open commitments, and three things I should
          cover today.
      tecnologia:
        body: >
          You meet with a peer from tech. Ask Claude for last
          contact, open commitments, three topics.
        prompt: |
          I have a meeting with Marta in ten minutes about a shared
          topic. Give me last contact, open commitments, and three
          things I should cover today.
      producto:
        body: >
          You meet with Pablo (product). Ask Claude for last
          contact, open commitments, three topics.
        prompt: |
          I have a meeting with Pablo in ten minutes. Give me last
          contact, open commitments, and three things I should
          cover today.
      finanzas:
        body: >
          You meet with Cristina (finance). Ask Claude for last
          contact, open commitments, three topics.
        prompt: |
          I have a meeting with Cristina in ten minutes. Give me
          last contact, open commitments, and three things I should
          cover today.
      rrhh:
        body: >
          You meet with Andrea (HR). Ask Claude for last contact,
          open commitments, three topics.
        prompt: |
          I have a meeting with Andrea in ten minutes. Give me last
          contact, open commitments, and three things I should
          cover today.
      legal:
        body: >
          You meet with Carmen (legal). Ask Claude for last
          contact, open commitments, three topics.
        prompt: |
          I have a meeting with Carmen in ten minutes. Give me last
          contact, open commitments, and three things I should
          cover today.
      estrategia:
        body: >
          You meet with Pablo Sastre (CEO, strategy). Ask Claude
          for last contact, open commitments, three topics.
        prompt: |
          I have a meeting with Pablo Sastre in ten minutes. Give
          me last contact, open commitments, and three things I
          should cover today.

  - id: registro-post-reunion
    title: Log without writing
    body: >
      Two minutes after the meeting, tell Claude what happened in
      one sentence and it files it in the right place. You don't
      write notes, you talk and they get saved.
    prompt: |
      Just finished with Marta. I asked for the proposal by Friday,
      she asked for the revised contract. File it in her page and
      remind me tomorrow.
    hint: >
      Trick: say it in the order of who owes whom. "I asked X, she
      asked Y." That way you never forget what you owe.
    xp: 10
    expected_response_seconds: 45
    voice_first: true
    success:
      type: claude_tool_call
      match:
        tool: Edit
        path_regex: "01-personas/(marta|andrea|lucia|cristina|carmen|pablo|maya|ashley|lucy|christine|caroline|peter)"
    success_title: "Nice. The meeting is logged"
    success_sub: "You earned 10 XP. Last, end of day."

  - id: cierre-del-dia
    title: Close the day
    body: >
      Last question before you turn off. What you closed, what you
      moved, what's pending, and a brief ready for tomorrow first
      thing.
    prompt: |
      Summarize the day. What I closed, what I moved, what's left.
      And prep tomorrow morning's brief.
    hint: >
      Trick: this summary is the input for the next morning's
      brief. Every day starts knowing where you stopped, without
      you having to remember.
    xp: 10
    expected_response_seconds: 60
    voice_first: true
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(summariz|summar|close|brief).{0,40}(day|tomorrow|morning)"
    success_title: "Nice. The day is closed"
    success_sub: "You earned 10 XP. Three weeks of this and it's routine."

on_complete:
  total_xp: 40
  takeaways:
    - Start the day with the brief. Same question every morning.
    - Two-minute brief before every meeting.
    - Log right after, by talking, not typing.
    - Close with what's left and tomorrow's brief already prepped.
  next_module: m5-subagentes
  milestone_screen: hito-dia7
  trigger_signup: false
