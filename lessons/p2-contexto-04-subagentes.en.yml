# Fase 2, Pillar 2 Context, Lesson 4. EN.

id: p2-contexto-04-subagentes
module_number: 204
language: en
title: Subagents as context bubbles
subtitle: Delegate heavy work without polluting your main chat
description: >
  A subagent is a specialist with its own context window. When you
  delegate something, it works aside and returns just the result.
  Your main conversation stays clean. Great for tasks that read a
  lot and answer little.
estimated_minutes: 6
sandbox: empresa-prueba
mental_model: >
  Your Claude chat is the main office. A subagent is an analyst
  who takes the file to another room, works it there, and brings
  you a note. Their room gets messy, yours does not.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: revisar-agents
    title: Check available subagents
    body: >
      /agents opens the panel. Today you will see the samples that
      ship with Empresa Prueba: scheduler, reviewer, scout. Look at
      the "description" column: that is what Claude reads to decide
      when to wake them up.
    prompt: |
      /agents
    hint: >
      Trick: a subagent's description is the CV Claude reads. Better
      description, better auto-delegation.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: agents
    success_title: "Nice. You met your invisible team"
    success_sub: "You earn 10 XP. Let us delegate something heavy."

  - id: delegar-tarea
    title: Delegate a long search
    body: >
      Ask Claude to crawl several teams looking for mentions of a
      topic. That is a task that would fill your window reading
      many files. So you delegate: a subagent does it and brings
      back just the summary.
    prompt: |
      use a subagent to search across all teams for mentions of "quarterly board" and return only a one-sentence summary per team where it appears
    hint: >
      Trick: delegate when a task reads a lot and returns little.
      Reports, searches, long reviews. Your main chat stays clean.
    xp: 10
    expected_response_seconds: 90
    success:
      type: claude_tool_call
      match:
        tool: Task
    success_title: "Nice. Delegated without dirtying context"
    success_sub: "You earn 10 XP. The subagent read for you and brought the summary."

  - id: comprobar-ventana
    title: Confirm your window stayed light
    body: >
      /status. You will see the counter rose little compared to
      what reading it all yourself would have taken. That is the
      point: heavy reading lives in the subagent bubble, not in
      yours.
    prompt: |
      /status
    hint: >
      Trick: compare to how much three teams cost in lesson 1 of
      the pillar. If this task touched more files and your counter
      rose less, the subagent did its job.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: status
    success_title: "Nice. Pillar 2 closed"
    success_sub: "You earn 10 XP. Window, scissors, memory, delegation. On to prompting."

on_complete:
  total_xp: 30
  takeaways:
    - A subagent works in its own context window.
    - It returns only the result, not the full history.
    - Ideal for tasks that read a lot and answer little.
  next_module: p3-prompting-01-contexto-objetivo-tono
