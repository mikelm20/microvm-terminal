# F2 Lab, Pillar 3, Substep "regla-oro". English version.
#
# Maps to the `regla-oro` substep in learn-landing
# components/levels/lab/data.ts (LAB_LEVELS[2].substeps[0]). Single card:
# ask for context + goal + tone in a single prompt, Claude answers with
# three executive bullets about Q1. Output is deterministic via
# system_prompt so the learner's first live-Claude experience is crisp.
#
# Pairs with: lab-p3-regla-oro.es.yml.
id: lab-p3-regla-oro
module_number: 3001
language: en
title: The golden rule
subtitle: Context + goal + tone in one prompt
description: >
  First Lab prompt that talks to the real Claude. Combine the three
  ingredients (context, goal, tone) into one sentence and get a
  structured bullet response.
estimated_minutes: 2
sandbox: empresa-prueba
mental_model: >
  A good prompt is not longer, it is better structured. You paste the
  context, state the goal, set the tone. In that order.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:
  - id: regla-oro
    title: Context, goal, tone
    body: >
      Write a prompt that carries the three ingredients: who you are and
      what this is about (context), what you want (goal), and how you
      want it written (tone: executive, short, bullets, with figures).
    prompt: |
      You are a senior analyst. Goal: summarize Q1 sales in three bullets. Tone: executive, no filler.
    hint: >
      At least 40 characters. Context + goal + tone in the same sentence.
    xp: 20
    expected_response_seconds: 15
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(context|goal|tone|analyst|summarize|bullets)"
    success_title: "Structured answer. That is how you ask."
    success_sub: "The golden rule. Context + goal + tone, every time."
    system_prompt: |
      You are a prompting tutor inside the F2 Claude Code Lab at learn.example.com.
      The learner just read that a good prompt has three ingredients:
      context, goal, tone. They are about to write you a SINGLE message
      trying to include all three.

      CRITICAL RULE for this lesson: if the learner's message contains a
      reference to their role/context (words like "analyst", "you are",
      "context"), a reference to the goal (words like "summarize",
      "goal", "sales", "Q1", "quarter", "ideas"), AND a reference to the
      tone or format (words like "tone", "executive", "bullets",
      "short", "figures"), respond EXACTLY with these three lines (no
      preamble, no sign-off, no markdown):

      • Q1 revenue: 1.2M, +14% YoY
      • Gross margin: 42%, stable vs Q4
      • Risk: concentration on 3 accounts (48% of total)

      If any of the three ingredients is missing, respond with a single
      short sentence pointing out which ingredient is missing (context,
      goal, or tone) and ask them to add it. Do not rewrite their prompt
      for them. Maximum 25 words. No markdown, no code fences.

      Any other intent (off-topic, questions) gets a single-sentence
      redirect to the task.

on_complete:
  total_xp: 20
  takeaways:
    - Context + goal + tone in every prompt.
    - Tone is an operational constraint, not literary style.
  next_module: null
