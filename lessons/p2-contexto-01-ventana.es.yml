# Fase 2, Pilar 2 Contexto, Leccion 1. Version ES.
#
# Hacer tangible la ventana de contexto: verla llenarse. Mascado alto
# en la primera mitad (prompts literal), medio al final. El concepto
# del Pilar 2 empieza aqui y se consolida en las tres lecciones
# siguientes.
#
# Predicados:
#   - claude_slash_command: { command: status }
#   - claude_tool_call:     { tool: Read, path_regex }
#   - claude_prompt_sent:   { match_regex }

id: p2-contexto-01-ventana
module_number: 201
language: es
title: Ve tu ventana de contexto llenarse
subtitle: El contador que decide cuanto puede recordar Claude
description: >
  Cada conversacion con Claude tiene un espacio finito. A mas
  archivos leidos, mas mensajes intercambiados, mas lleno. Lo
  importante no es la cifra exacta, es que sepas que existe y
  que la tienes que cuidar. Hoy la ves en vivo.
estimated_minutes: 6
sandbox: empresa-prueba
mental_model: >
  La ventana de contexto es la mesa de trabajo. Todo lo que
  quieras que Claude vea, lo pones encima. La mesa es grande pero
  no infinita. Cuando se llena, hay que recoger.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: status-inicial
    title: Mira la ventana vacia
    body: >
      Arrancamos por ver el estado antes de meter nada. /status
      te da un porcentaje de contexto bajo, porque la conversacion
      acaba de empezar. Fijate en el numero, lo vas a vigilar.
    prompt: |
      /status
    hint: >
      Truco: en /status, busca la linea que dice "context" con un
      porcentaje. Ese es el contador.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: status
    success_title: "Bien. Conoces tu punto de partida"
    success_sub: "Ganas 10 XP. Ahora vas a ensuciar la mesa a proposito."

  - id: cargar-departamentos
    title: Mete varios archivos en la conversacion
    body: >
      Pidele a Claude que lea tres departamentos seguidos. Cada
      lectura ocupa espacio en la ventana. Vas a ver como cada
      Read suma.
    prompt: |
      lee 01-ventas, 02-marketing y 03-tecnologia y dime en una frase por departamento que hace cada uno
    hint: >
      Truco: tres es suficiente para notar el cambio. Con ocho
      ya veras la ventana bastante llena, pero eso lo veras solo.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "(01-ventas|02-marketing|03-tecnologia)"
    success_title: "Bien. Acabas de cargar tres departamentos"
    success_sub: "Ganas 10 XP. Ahora toca mirar el contador otra vez."

  - id: status-despues
    title: Comprueba la ventana despues
    body: >
      Vuelve a /status. El porcentaje subio. Eso es lo que
      queriamos que vieras: cada accion consume. No te asustes
      con el numero, solo nota que se mueve.
    prompt: |
      /status
    hint: >
      Truco: si sube poco, perfecto, tu conversacion es ligera.
      Si sube mucho tras leer pocos archivos, es que los archivos
      eran grandes. El tamano importa, no solo la cantidad.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: status
    success_title: "Bien. Viste el contador subir"
    success_sub: "Ganas 10 XP. Mitad del pilar lista: sabes que el contexto se gasta."

  - id: reflexion-ligera
    title: Pregunta que ocupa mas
    body: >
      Cierre de concepto. Pidele a Claude que te diga que es lo
      que mas ocupa la ventana en general: codigo, archivos
      largos, logs. Asi fijas la intuicion.
    prompt: |
      en general, que es lo que mas llena la ventana de contexto cuando trabajas conmigo?
    hint: >
      Truco: la respuesta te va a servir el resto del pilar.
      Probablemente diga "archivos grandes, historiales largos,
      logs de comandos". Quedate con eso.
    xp: 10
    expected_response_seconds: 20
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(contexto|ventana|ocupa|llena)"
    success_title: "Bien. Ya entiendes que es el contexto"
    success_sub: "Ganas 10 XP. Siguiente leccion: como recoger la mesa sin perder el hilo."

on_complete:
  total_xp: 40
  takeaways:
    - La ventana de contexto es finita y se ve con /status.
    - Cada archivo leido y cada turno suma al contador.
    - Archivos grandes pesan mas que turnos cortos.
  next_module: p2-contexto-02-clear-compact
