# Fase 2, Pilar 1 Comandos, Leccion 2. Version ES.
#
# Abrir el modo interactivo de claude, usar /help para ver los comandos
# disponibles, salir con /exit. Mascado alto todavia: los slash commands
# son un vocabulario cerrado, mejor mostrarlo literal.
#
# Predicados:
#   - process_started:        { name: claude }
#   - claude_slash_command:   { command: help }
#   - claude_slash_command:   { command: exit }

id: p1-comandos-02-interactivo
module_number: 102
language: es
title: Abrir conversacion con claude
subtitle: El modo interactivo, /help para orientarte, /exit para salir
description: >
  Ahora abres una conversacion de verdad. Tecleas claude a secas y
  entras en un prompt que recuerda lo que dices mientras estas
  dentro. /help te ensena los comandos que existen. /exit te saca
  limpio.
estimated_minutes: 4
sandbox: empresa-prueba
mental_model: >
  claude interactivo es el "cafe largo" con Claude. Te sientas,
  charlas, te va reteniendo el hilo. /help es el menu del bar.
  /exit es levantarse de la silla.

preconditions:
  working_directory: /home/learner/empresa-prueba

steps:

  - id: abrir-claude
    title: Abre el modo interactivo
    body: >
      Escribe el comando tal cual y Enter. Vas a ver que la terminal
      cambia: aparece un prompt distinto, con un marco o un icono,
      porque Claude ya esta dentro esperandote.
    prompt: |
      claude
    hint: >
      Sin argumentos, solo "claude" y Enter. Si quieres cerrarlo de
      emergencia, Ctrl+C dos veces o /exit. Lo vamos a ver en un
      paso.
    xp: 10
    expected_response_seconds: 15
    success:
      type: process_started
      match:
        name: claude
    success_title: "Dentro. Claude esta esperandote"
    success_sub: "Ganas 10 XP. Ahora vamos a pedirle ayuda al propio Claude."

  - id: slash-help
    title: Pregunta que comandos existen
    body: >
      Los slash commands son atajos que ejecuta Claude sin pasar
      por el modelo. /help te los lista. No te los aprendas todos,
      solo saber que estan ahi.
    prompt: |
      /help
    hint: >
      Truco: /help es la puerta de entrada a todo. Si alguna vez no
      te acuerdas del nombre exacto, /help y buscas.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: help
    success_title: "Bien. Has visto el menu completo"
    success_sub: "Ganas 10 XP. Ya sabes donde mirar cuando te pierdas."

  - id: slash-exit
    title: Sal limpio con /exit
    body: >
      Cuando termines una conversacion, /exit cierra Claude y te
      devuelve la terminal. Es mas limpio que Ctrl+C: guarda el
      transcript y libera recursos.
    prompt: |
      /exit
    hint: >
      Truco: en cualquier leccion de aqui en adelante, si te atascas
      puedes /exit y volver a abrir claude. El transcript se guarda.
    xp: 10
    expected_response_seconds: 10
    success:
      type: claude_slash_command
      match:
        command: exit
    success_title: "Bien. Has salido limpio"
    success_sub: "Ganas 10 XP. Sabes abrir, pedir ayuda y cerrar. Mecanica basica hecha."

on_complete:
  total_xp: 30
  takeaways:
    - claude a secas abre conversacion interactiva que recuerda.
    - /help lista todos los slash commands disponibles.
    - /exit cierra limpio y guarda el transcript.
  next_module: p1-comandos-03-discovery
