# Fase 2, Pilar 2 Contexto, Leccion 2. Version ES.
#
# Dos herramientas para cuidar la ventana: /clear (reset limpio) y
# /compact (resumen comprimido que deja continuar). Mascado medio: los
# slash se muestran literal pero los prompts en lenguaje natural los
# compone mas el usuario.
#
# Predicados:
#   - claude_slash_command: { command: clear }
#   - claude_slash_command: { command: compact }
#   - claude_prompt_sent:   { match_regex }

id: p2-contexto-02-clear-compact
module_number: 202
language: es
title: Recoge la mesa con /clear y /compact
subtitle: Saltar de tema sin arrastrar historial, o comprimirlo
description: >
  Dos atajos para la ventana. /clear borra la conversacion y
  arranca fresca: perfecto para cambiar de tema. /compact
  comprime lo que hay en un resumen y te deja seguir con el
  mismo hilo pero mas ligero. Elige segun si cortas o continuas.
estimated_minutes: 6
sandbox: empresa-prueba
mental_model: >
  /clear es "recoger la mesa entera, a la siguiente reunion".
  /compact es "hacer una foto de lo que hay, tirar los originales,
  seguir trabajando sobre la foto".

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: cargar-tema-1
    title: Carga una primera conversacion
    body: >
      Empieza pidiendo algo concreto sobre un departamento. Lo
      importante no es la respuesta, es que haya historial que
      luego puedas borrar o comprimir.
    prompt: |
      leete 05-finanzas y explicame las tres lineas mas importantes
    hint: >
      Truco: lo que pidas aqui es material de practica. Lee con
      atencion solo para luego comparar como cambia el contexto.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "05-finanzas"
    success_title: "Bien. Tienes historial cargado"
    success_sub: "Ganas 10 XP. Vamos a borrarlo de un golpe."

  - id: usar-clear
    title: Corta con /clear
    body: >
      Vas a cambiar de tema por completo. Quieres hablar ahora de
      marketing, y el historial de finanzas solo te estorba. /clear
      resetea la conversacion sin cerrar Claude.
    prompt: |
      /clear
    hint: >
      Truco: /clear es "borron y cuenta nueva". Lo que borras no se
      recupera dentro de la sesion. Si necesitas seguir con lo de
      antes, mejor /compact, lo vemos ya.
    xp: 10
    expected_response_seconds: 5
    success:
      type: claude_slash_command
      match:
        command: clear
    success_title: "Bien. Ventana limpia"
    success_sub: "Ganas 10 XP. Puedes cambiar de tema sin arrastre."

  - id: cargar-tema-2
    title: Empieza un tema nuevo
    body: >
      Ahora si, arrancas limpio con marketing. Este es el patron
      que usaras todo el dia: /clear entre tareas distintas.
    prompt: |
      leete 02-marketing y dime en dos frases que estan haciendo
    hint: >
      Truco: /clear entre cada bloque de trabajo evita que el
      contexto se te llene a media tarde con cosas del dia que ya
      cerraste.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "02-marketing"
    success_title: "Bien. Tema nuevo, ventana limpia"
    success_sub: "Ganas 10 XP. Ahora la alternativa: comprimir en vez de borrar."

  - id: usar-compact
    title: Comprime con /compact
    body: >
      Caso distinto: quieres seguir hablando de lo mismo pero el
      historial es largo. /compact resume lo anterior en un
      mensaje mas corto y te deja continuar. Pierdes detalle
      literal, ganas espacio.
    prompt: |
      /compact
    hint: >
      Truco: /compact cuando quieres continuidad pero aligerar.
      /clear cuando quieres discontinuidad total. Se eligen
      segun el tipo de ruptura.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_slash_command
      match:
        command: compact
    success_title: "Bien. Has comprimido el hilo"
    success_sub: "Ganas 10 XP. Ya tienes las dos tijeras de contexto. Siguiente: memoria permanente."

on_complete:
  total_xp: 40
  takeaways:
    - /clear resetea la conversacion sin salir de Claude.
    - /compact comprime el historial y deja continuar el hilo.
    - /clear entre tareas distintas, /compact dentro de la misma.
  next_module: p2-contexto-03-claude-md
