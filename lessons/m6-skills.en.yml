# Module 6, Skills. EN version.

id: m6-skills
module_number: 6
language: en
title: Skills
subtitle: Your favorite shortcuts, saved
description: >
  If you ask the same thing every morning, that's not a conversation,
  it's a procedure. A skill is that procedure saved, with a short
  name, that Claude executes when you invoke it.
estimated_minutes: 8
sandbox: empresa-prueba
mental_model: >
  Subagent is WHO. Skill is HOW. The comms lead can have the
  "post-linkedin" skill and the "press-note" skill. Same brain,
  different recipes.

preconditions:
  working_directory: /home/learner/empresa-prueba/mi-trabajo
  claude_running: true

steps:

  - id: regla-tres-veces
    title: The rule of three times
    body: >
      If you've asked the same thing three times, it's a candidate
      for a skill. If only once, not yet.
    prompt: |
      look at my last conversation with you and tell me which
      three patterns repeat that are worth saving as skills
    hint: >
      Trick: let Claude detect the patterns. Your bias is thinking
      you repeat less than you do.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(pattern|repeat|skill)"
    success_title: "Nice. You have candidates"
    success_sub: "You earned 10 XP. Let's save the first one."

  - id: crear-skill-parte-matinal
    title: Create the parte-matinal skill
    body: >
      Each skill lives in .claude/skills/<name>/SKILL.md with a
      frontmatter that says when to use it and optionally which
      tools are pre-approved.
    prompt: |
      create a skill called parte-matinal in .claude/skills.
      Description: use every morning when opening Claude to get
      the day's summary. Steps: read 00-bandeja/calendario.md,
      read 00-bandeja/inbox/, check 01-personas for pending
      items, return a four-bullet brief.
    hint: >
      Trick: the more specific the steps, the more consistent the
      answer every morning.
    xp: 10
    expected_response_seconds: 60
    success:
      type: file_exists
      match:
        path: /home/learner/empresa-prueba/mi-trabajo/.claude/skills/parte-matinal/SKILL.md
    success_title: "Nice. Your first skill is saved"
    success_sub: "You earned 10 XP. Try it with /parte-matinal."
    role_variants:
      ventas:
        body: Sales-flavored parte-matinal skill (pipeline, top accounts, Q risks).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, 01-personas, summarize pipeline,
          top accounts and Q risks.
      marketing:
        body: Marketing-flavored parte-matinal (funnel, active campaigns, CPL).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize funnel, active campaigns,
          cost per lead.
      tecnologia:
        body: Tech-flavored parte-matinal (incidents, deploys, SLOs).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize incidents, deploys,
          SLO status.
      producto:
        body: Product-flavored parte-matinal (discovery, adoption, roadmap).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize discovery, adoption,
          roadmap status.
      finanzas:
        body: Finance-flavored parte-matinal (closes, DSO, alerts).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize closes, DSO, financial
          alerts.
      rrhh:
        body: HR-flavored parte-matinal (vacancies, interviews, reviews).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize vacancies, interviews,
          open reviews.
      legal:
        body: Legal-flavored parte-matinal (contracts, expirations, regulatory alerts).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize contracts, expirations,
          regulatory alerts.
      estrategia:
        body: Strategy-flavored parte-matinal (partnerships, board, investors).
        prompt: |
          create a skill parte-matinal in .claude/skills. Steps:
          read calendar, inbox, summarize partnerships, next board,
          investor cadence.

  - id: invocar-skill
    title: Invoke it
    body: >
      Once saved, fire it with /<name>. Claude loads the recipe
      only then.
    prompt: |
      /parte-matinal
    hint: >
      Trick: you can also say "launch the brief" in plain language
      and Claude activates it by the description.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_slash_command
      match:
        command: parte-matinal
    success_title: "Nice. You ran your first recipe"
    success_sub: "You earned 10 XP. One important idea left."

  - id: skill-vs-subagente
    title: Review the difference vs a subagent
    body: >
      Skill: recipe. Same Claude, saved instructions. Loads only
      when invoked. Subagent: specialist. Different context,
      different mission, different model.
    prompt: |
      explain in four sentences the difference between a skill and
      a subagent, with a concrete example of the jefe-de-agenda I
      created yesterday.
    hint: >
      Trick: "do I need another head or just another recipe?".
      Another head is a subagent. Another recipe is a skill.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(skill).{0,40}(subagent|subagente)"
    success_title: "Nice. You can tell them apart"
    success_sub: "You earned 10 XP. Module 6 closed."

on_complete:
  total_xp: 40
  takeaways:
    - Skill = recipe saved in .claude/skills/<name>/SKILL.md
    - Loads only when invoked, not always like CLAUDE.md
    - Invoke with /<name> or by description in plain language
    - Rule of three times before creating one.
  next_module: m7-mcps
  trigger_signup: false
