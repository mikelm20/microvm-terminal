# hello-claude is the smoke-test lesson exercised by tests/learner-bot.
# It covers the full predicate spine:
#   - guest-agent watcher events (agent_online, process_started, port_listening)
#   - claude-wrap stream-json parser events (claude_prompt_sent, claude_tool_call)
# One fixture per step lives in tests/fixtures/claude/hello-claude/.

id: hello-claude
module_number: 0
language: en
title: Your first Claude Code session
description: >
  Launch Claude Code in your sandbox, ask it to build something small,
  run it, and open the preview. End to end in under five minutes.

steps:
  - id: agent-online
    title: Sandbox is ready
    hint: The guest agent has connected. Start typing in the terminal.
    xp: 0
    success:
      type: agent_online

  - id: start-claude
    title: Start Claude Code
    hint: "Type `claude` and press Enter. Say hi, or ask it to build you a small app."
    xp: 0
    success:
      type: process_started
      match:
        name: claude

  - id: run-server
    title: Run a dev server
    hint: Once Claude has written something, run it. A port will open and we will detect it.
    xp: 0
    success:
      type: port_listening

  - id: first-prompt
    title: Send your first prompt
    hint: Type any short message and press Enter. Claude Code will reply.
    xp: 10
    success:
      type: claude_prompt_sent

  - id: first-tool-call
    title: Watch Claude use a tool
    hint: Ask Claude to read README.md. The tool call card streams into the sidebar.
    xp: 10
    success:
      type: claude_tool_call
      match:
        tool: Read
