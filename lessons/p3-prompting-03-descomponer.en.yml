# Fase 2, Pillar 3 Prompting, Lesson 3. EN.

id: p3-prompting-03-descomponer
module_number: 303
language: en
title: Break big tasks apart
subtitle: Split the work, not the prompt. Fase 2 closer.
description: >
  When the work weighs, the temptation is to write a huge prompt.
  It works worse. What works is splitting the task into small
  pieces, each with its short prompt and its check. Module close:
  you compose yourself, no scaffolding.
estimated_minutes: 8
sandbox: empresa-prueba
mental_model: >
  It is not "one big prompt". It is "a chain of small prompts".
  Every step delivers something visible. If one fails, you redo
  that one. Cooking step by step, not one pot.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: identificar-tarea
    title: Pick a big task and split it into three
    body: >
      First, state a real piece of work you have pending (report,
      proposal, audit, plan). Second, in the SAME prompt, ask
      Claude to break it into three deliverable pieces and return
      only the list of three, without executing.
    hint: >
      Trick: "return only the list, do not execute yet" is the
      key phrase. Forces Claude to plan before acting.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(three|3).{0,60}(pieces|parts|deliverables|steps|sections)"
    success_title: "Nice. You have a plan before executing"
    success_sub: "You earn 10 XP. Now execute the first piece alone."

  - id: ejecutar-pieza-1
    title: Run only the first piece
    body: >
      No prompt given. You pick the first piece of the plan and
      ask Claude to do it. Apply the golden rule: context, goal,
      tone. If it fits, use a subagent so heavy reading does not
      pollute your context.
    hint: >
      Trick: if the piece means reading many files, delegate to
      a subagent with Task. Your main chat stays clean for pieces
      2 and 3.
    xp: 10
    expected_response_seconds: 120
    success:
      type: claude_prompt_sent
    success_title: "Nice. First piece delivered"
    success_sub: "You earn 10 XP. Move on to piece two, same pattern."

  - id: iterar-libre
    title: Close the last two pieces, your style
    body: >
      Last: run piece 2, then piece 3. Between pieces, use
      /compact if context gets heavy, or /clear if you switch
      topic inside the same plan. Composing free. This is what
      you will do every day after Fase 2.
    hint: >
      Trick: it is normal to forget /compact the first time. If
      you feel Claude slower or /status high, that is your cue.
    xp: 10
    expected_response_seconds: 240
    success:
      type: claude_prompt_sent
    success_title: "Nice. You closed a big task in pieces"
    success_sub: "You earn 10 XP. Fase 2 done. You are ready to work without scaffolding."

on_complete:
  total_xp: 30
  takeaways:
    - Splitting the task before writing the prompt always beats the giant prompt.
    - Every piece delivers something visible, so you can iterate piece by piece.
    - Combining with /compact, /clear and subagents keeps the pace.
  next_module: null
  milestone_screen: fase-2-completa
