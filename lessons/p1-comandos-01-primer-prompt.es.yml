# Fase 2, Pilar 1 Comandos, Leccion 1. Version ES.
#
# Primera leccion del pilar: prompt one-shot con claude --print. Mascado alto:
# el prompt se muestra literal y el usuario solo lo copia o teclea para ver
# que la mecanica basica responde. Prepara el terreno para meterse en el
# modo interactivo en la siguiente leccion.
#
# Predicados usados:
#   - claude_prompt_sent: { match_regex }
#   - claude_tool_call:   { tool: Read, path_regex }

id: p1-comandos-01-primer-prompt
module_number: 101
language: es
title: Tu primer prompt en una linea
subtitle: Un solo comando, una respuesta, sin abrir conversacion
description: >
  Arrancamos por lo mas simple. claude seguido de tu pregunta entre
  comillas te devuelve una respuesta y cierra. Sirve para atajos
  rapidos: una frase, un calculo, una duda suelta. Sin sesion, sin
  historial, sin ruido.
estimated_minutes: 5
sandbox: empresa-prueba
mental_model: >
  claude --print es el "pregunta y cierra". Como echarle una
  pregunta corta a un colega de paso. No abre conversacion, no
  recuerda. Una ida, una vuelta.

preconditions:
  working_directory: /home/learner/empresa-prueba

steps:

  - id: pregunta-directa
    title: Manda tu primera pregunta en una linea
    body: >
      Copia el comando de abajo tal cual y pulsa Enter. Vas a ver a
      Claude responderte en la misma terminal, sin abrir ninguna
      conversacion. Una pregunta, una respuesta, se acabo.
    prompt: |
      claude --print "dime en una frase que es claude code"
    hint: >
      El comando exacto: claude --print "tu pregunta". Las comillas
      son obligatorias. --print tambien se escribe -p, ahorra cuatro
      letras.
    xp: 10
    expected_response_seconds: 20
    success:
      type: claude_prompt_sent
      match_regex: "(?i)claude\\s*code"
    success_title: "Bien. Primer prompt enviado"
    success_sub: "Ganas 10 XP. Has visto que no hace falta abrir conversacion para hablar con el."

  - id: pregunta-con-archivo
    title: Pidele que mire un archivo
    body: >
      Mismo formato, pero ahora le pides que LEA algo antes de
      responder. Claude abre el archivo, lo procesa, y contesta.
      Vas a ver una tarjeta de tool call: "Read 01-ventas/..." al
      lado de la terminal.
    prompt: |
      claude --print "lee 01-ventas/README.md y dime en dos frases que hace este departamento"
    hint: >
      Truco: la ruta la pones dentro del prompt. Claude no adivina
      donde mirar; se lo dices tu.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "01-ventas"
    success_title: "Bien. Claude ha leido el archivo y te ha respondido"
    success_sub: "Ganas 10 XP. Has encadenado lectura y respuesta en un solo comando."

  - id: formato-json
    title: Pide la respuesta en JSON
    body: >
      El flag --output-format json hace que la respuesta salga
      estructurada, util si otro programa va a leerla. Aqui solo
      lo vas a ver para que sepas que existe. El dia que lo
      necesites, ya lo has tocado.
    prompt: |
      claude --print --output-format json "dame tres ideas cortas para una demo de ventas"
    hint: >
      Truco: json para pipelines, texto plano para humanos. Hoy
      somos humanos, pero queremos saber que existe el otro modo.
    xp: 10
    expected_response_seconds: 25
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(demo|ideas|ventas)"
    success_title: "Bien. Has visto la respuesta estructurada"
    success_sub: "Ganas 10 XP. Listo para abrir conversacion de verdad en la siguiente leccion."

on_complete:
  total_xp: 30
  takeaways:
    - claude --print "pregunta" devuelve una respuesta y cierra.
    - Le puedes pedir que lea archivos dentro del mismo comando.
    - --output-format json existe para pipelines, no para ti hoy.
  next_module: p1-comandos-02-interactivo
