# Fase 2, Pillar 3 Prompting, Lesson 2. EN.

id: p3-prompting-02-ejemplos-y-critica
module_number: 302
language: en
title: Examples and self-critique
subtitle: Few-shot and asking for review are the two most underused levers
description: >
  Two techniques anyone can apply with no theory. First: give an
  example of the answer you want and it will nail it. Second: when
  it replies, ask it to critique itself. The second take is often
  the good one.
estimated_minutes: 6
sandbox: empresa-prueba
mental_model: >
  Teaching by example always beats teaching by instruction.
  Correcting by looking in the mirror always beats the first take.
  Apply it to Claude the same way you would to a human.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: few-shot
    title: Give an example of the answer you want
    body: >
      Ask it to write a follow-up to a client, but instead of
      describing the style, paste one of your past messages as an
      example. Claude copies the pattern better than any
      description you give.
    prompt: |
      write a follow-up message to the Acme client. Tone and format like this past message of mine: "Hi Ana, yesterday we discussed the proposal, sending you the fixed version with the volume discount applied. If it works we can close tomorrow. Best, Joe." Do not copy the content, copy the pattern.
    hint: >
      Trick: "copy the pattern, not the content". That phrase makes
      it clear the example is style, not a rigid template.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(example|pattern|tone.{0,20}format|like\\s+this)"
    success_title: "Nice. Few-shot applied"
    success_sub: "You earn 10 XP. On to the second: self-critique."

  - id: pedir-critica
    title: Ask it to critique its own reply
    body: >
      Without changing topic, ask it to look at the previous
      message and tell you three things it could improve. No
      hedging. The first critique is always too polite. So you
      ask it to be harsh.
    prompt: |
      review your own previous message and give me three concrete things that could be better. Be harsh, do not say "it is fine but".
    hint: >
      Trick: "be harsh" works better than "be honest" or "be
      critical". The explicit word unlocks a less agreeable Claude.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(review|critique|improve|harsh|honest)"
    success_title: "Nice. You asked for critique and got something useful"
    success_sub: "You earn 10 XP. Last step: combine both for a real deliverable."

  - id: combinar
    title: Combine example and critique
    body: >
      Pick something you actually need to write today at work.
      Apply the full pattern: give an example of the style, ask
      for version 1, then ask for critique. No literal prompt.
      You build it.
    hint: >
      Trick: the loop is example, version 1, critique, version 2.
      More iterations are rarely needed. If you are on the fifth,
      check the goal; it is probably unclear.
    xp: 10
    expected_response_seconds: 120
    success:
      type: claude_prompt_sent
    success_title: "Nice. You closed the example plus critique loop"
    success_sub: "You earn 10 XP. Composing free. Last lesson: big tasks."

on_complete:
  total_xp: 30
  takeaways:
    - Giving an example (few-shot) beats describing the desired style.
    - Asking for harsh self-critique produces a better second version.
    - The example, version 1, critique, version 2 loop is the base pattern.
  next_module: p3-prompting-03-descomponer
