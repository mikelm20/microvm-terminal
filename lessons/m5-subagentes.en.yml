# Module 5, Subagents. EN version.

id: m5-subagentes
module_number: 5
language: en
title: Subagents
subtitle: Your invisible team of specialists
description: >
  Claude Code doesn't have to do everything itself. You can define
  specialists (schedule keeper, communications lead, analyst), each
  with its own mission, model, and tools. Claude auto-delegates
  based on the request.
estimated_minutes: 9
sandbox: empresa-prueba
mental_model: >
  Claude is your chief of staff. Subagents are the specialists it
  hires for you. You talk to the chief, the chief distributes.

preconditions:
  working_directory: /home/learner/empresa-prueba/mi-trabajo
  claude_running: true

steps:

  - id: ver-subagentes-vacios
    title: See what subagents you have today
    body: >
      Before creating any, check the state. The /agents command
      opens the list of active subagents at project and user level.
      Today it's empty.
    prompt: |
      /agents
    hint: >
      Trick: /agents also lets you create, edit, and delete via a
      menu, but today we create it by hand so you see how it works.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: agents
    success_title: "Nice. The shelf is empty"
    success_sub: "You earned 10 XP. Let's hire the first one."

  - id: crear-jefe-de-agenda
    title: Create the schedule keeper
    body: >
      Each subagent lives in .claude/agents/<name>/<name>.md with
      a frontmatter that says who it is, what it does, and what
      model it uses. Claude reads the description to decide when
      to delegate.
    prompt: |
      create a subagent called jefe-de-agenda in .claude/agents.
      Mission: manage my calendar, fit meetings without breaking
      prior commitments, and flag free slots. Use
      claude-haiku-4-5 (fast and cheap for calendar work) and
      give it read permissions on the calendar and edit on
      01-personas.
    hint: >
      Trick: the frontmatter description is what matters most.
      The better it describes WHEN to use this subagent, the
      better Claude activates it on its own.
    xp: 10
    expected_response_seconds: 60
    success:
      type: file_exists
      match:
        path: /home/learner/empresa-prueba/mi-trabajo/.claude/agents/jefe-de-agenda/jefe-de-agenda.md
    success_title: "Nice. Your first hire"
    success_sub: "You earned 10 XP. Now check and test it."
    role_variants:
      ventas:
        body: >
          Create jefe-de-agenda to fit customer meetings without
          breaking pipeline and flag gaps before Q closes.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: fit customer meetings without breaking pipeline,
          flag gaps before Q closes.
      marketing:
        body: >
          Create jefe-de-agenda to fit agency, events, and campaign
          deadlines.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: fit agency, events, campaign deadlines.
      tecnologia:
        body: >
          Create jefe-de-agenda to block deep work and protect
          on-call rotation.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: block deep work, protect on-call rotation.
      producto:
        body: >
          Create jefe-de-agenda to fit customer discovery without
          breaking planning.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: fit customer discovery without breaking
          planning or reviews.
      finanzas:
        body: >
          Create jefe-de-agenda to protect monthly closes and
          board reporting.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: protect monthly closes, board reporting, flag
          critical DSO early.
      rrhh:
        body: >
          Create jefe-de-agenda to group 1:1s and respect
          confidential slots.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: group 1:1s, respect confidential slots, block
          reviews.
      legal:
        body: >
          Create jefe-de-agenda to prioritize contract reviews and
          hearings.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: prioritize contract reviews and hearings, flag
          expirations.
      estrategia:
        body: >
          Create jefe-de-agenda to reserve time for board,
          investors, and partnerships.
        prompt: |
          create a subagent called jefe-de-agenda in .claude/agents.
          Mission: reserve time for board, investors, partnerships,
          protect long horizon.

  - id: invocar-jefe-de-agenda
    title: Ask something in its area without naming it
    body: >
      Real trick of subagents: you don't say "use the schedule
      keeper". You ask something in its area in plain language and
      Claude matches the description. If the description is good,
      it delegates on its own.
    prompt: |
      fit a team dinner this week without stepping on Thursday's
      meeting
    hint: >
      Trick: if Claude doesn't auto-delegate, the description is
      usually vague. Go back to the .md, specify better when to
      call it, retry.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Task
        subagent_type: jefe-de-agenda
    success_title: "Nice. Claude delegated to the specialist"
    success_sub: "You earned 10 XP. Last step: when NOT to create more."

  - id: regla-de-no-multiplicar
    title: The rule of not multiplying them
    body: >
      Two or three well-tuned subagents beat ten vague ones. Take
      a photo of the notebook where you sketched your invisible
      team (or a blank sheet with three names) and send it to the
      sandbox. Claude will use it to suggest improvements to the
      description of the jefe-de-agenda you already created.
    prompt: |
      look at the photo I just sent, plus the jefe-de-agenda .md,
      and suggest three improvements to make its description more
      precise. Don't edit, just propose.
    hint: >
      Trick: reviewing the .md is the user's job, not Claude's.
      Ask for proposals, you decide, you edit. That keeps control
      over who does what in your invisible team.
    xp: 10
    expected_response_seconds: 90
    requires_camera: true
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: ".claude/agents/jefe-de-agenda"
    success_title: "Nice. You know how to grow the team"
    success_sub: "You earned 10 XP. Module 5 closed."

on_complete:
  total_xp: 40
  takeaways:
    - Subagents live in .claude/agents/<name>/<name>.md
    - The description field matters, Claude reads it to auto-delegate.
    - You don't invoke them manually, the request activates them.
    - Start with one, grow on demand. Don't multiply.
  next_module: m6-skills
  trigger_signup: false
