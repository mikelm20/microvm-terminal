# Fase 2, Pilar 2 Contexto, Leccion 3. Version ES.
#
# CLAUDE.md como memoria persistente del proyecto, y /resume para
# retomar sesiones anteriores. Mascado medio: /init ya se toco en Pilar 1.
# Aqui vamos mas al "que escribes dentro" y la reapertura.
#
# Predicados:
#   - file_contents_regex: { path, regex }
#   - claude_tool_call:    { tool: Read, path_regex: "CLAUDE.md" }
#   - claude_slash_command:{ command: resume }
#   - claude_prompt_sent:  { match_regex }

id: p2-contexto-03-claude-md
module_number: 203
language: es
title: CLAUDE.md como memoria permanente
subtitle: Lo que no quieres repetir cada conversacion, escribelo una vez
description: >
  La ventana de contexto se recoge con /clear. Pero lo que de
  verdad te ahorra repetirte cada vez es un archivo CLAUDE.md en
  la raiz del proyecto. Claude lo lee automaticamente al abrir.
  Aqui lo escribes, lo pruebas, y aprendes a retomar sesiones
  con /resume.
estimated_minutes: 7
sandbox: empresa-prueba
mental_model: >
  CLAUDE.md es la ficha que dejas sobre la mesa de Claude para
  siempre. No se borra con /clear, no se comprime con /compact.
  Es tu memoria fuera de la ventana.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: escribir-claude-md
    title: Escribe un CLAUDE.md de proyecto
    body: >
      Le pides a Claude que cree un CLAUDE.md en la raiz de
      empresa-prueba con tres cosas: tu rol, como prefieres que te
      responda, y las dos prioridades del momento. Mantenlo corto.
    prompt: |
      crea un CLAUDE.md en la raiz con: soy empleado de empresa prueba, prefiero respuestas cortas en espanol sin listas largas, y mis prioridades esta semana son cerrar el trimestre y preparar la junta
    hint: >
      Truco: corto gana. Diez lineas bien puestas ahorran mas que
      cien mal puestas. Puedes crecerlo con el uso.
    xp: 10
    expected_response_seconds: 40
    success:
      type: file_contents_regex
      match:
        path: /home/learner/empresa-prueba/CLAUDE.md
        regex: "(?is)(empresa\\s+prueba|prioridades|respuestas\\s+cortas)"
    success_title: "Bien. Ya tienes memoria de proyecto"
    success_sub: "Ganas 10 XP. Vamos a ver que Claude la lee solo."

  - id: verificar-lectura
    title: Comprueba que Claude lo lee
    body: >
      /clear para dejar limpio y despues pidele algo sin darle
      contexto personal. Si el CLAUDE.md funciona, va a responderte
      en el tono que pediste y pensando en tus prioridades.
    prompt: |
      /clear
    hint: >
      Truco: /clear primero, y DESPUES haces una pregunta nueva.
      Asi te aseguras de que el contexto que notes viene del
      CLAUDE.md, no del historial anterior.
    xp: 10
    expected_response_seconds: 5
    success:
      type: claude_slash_command
      match:
        command: clear
    success_title: "Bien. Ventana limpia, memoria intacta"
    success_sub: "Ganas 10 XP. Comprueba que Claude sigue sabiendo quien eres."

  - id: preguntar-sin-contexto
    title: Preguntale algo personal
    body: >
      Pregunta algo que solo puede responder bien si esta leyendo
      tu CLAUDE.md. La respuesta debe llegar en el tono que
      definiste y mencionar alguna de tus prioridades.
    prompt: |
      dame un plan rapido para mi semana
    hint: >
      Truco: si la respuesta sale generica y no menciona tus
      prioridades, revisa el CLAUDE.md. Puede que se haya creado
      en otro sitio.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "CLAUDE.md"
    success_title: "Bien. Ha leido tu ficha sin que se lo pidieras"
    success_sub: "Ganas 10 XP. Ultima pieza: retomar conversaciones entre sesiones."

  - id: slash-resume
    title: Retoma con /resume
    body: >
      Cierras Claude, vuelves al rato, y quieres seguir donde lo
      dejaste. /resume te lista las sesiones recientes para elegir.
      Util cuando partes el dia y no quieres reexplicar.
    prompt: |
      /resume
    hint: >
      Truco: /resume + CLAUDE.md es el combo de continuidad.
      CLAUDE.md cuida el "quien eres" entre todas tus sesiones,
      /resume cuida el "donde lo dejaste" de una sesion concreta.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: resume
    success_title: "Bien. Sabes retomar entre sesiones"
    success_sub: "Ganas 10 XP. Pilar 2 casi cerrado: falta el scope aislado con subagentes."

on_complete:
  total_xp: 40
  takeaways:
    - CLAUDE.md es memoria que sobrevive a /clear y /compact.
    - Claude lo lee solo al abrir conversacion en esa carpeta.
    - /resume retoma una sesion anterior sin reexplicar nada.
  next_module: p2-contexto-04-subagentes
