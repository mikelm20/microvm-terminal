# Module 2, Your first conversation. EN version.
#
# First lesson a user without an account sees after pressing "Start free" on
# the landing. The conversation with Claude is CONTINUOUS across the four
# steps: the sandbox, the claude process, and the chat stay alive between
# consecutive steps.
#
# Predicates validated by control-plane/internal/lesson + claude-wrap.

id: m2-primera-conversacion
module_number: 2
language: en
title: Your first conversation
subtitle: Talk to Claude with context, goal, and tone
description: >
  Break the ice with Claude Code and get a first win in less than
  ten minutes. The whole conversation runs on the shared sandbox
  "Empresa Prueba", a fictional company with eight departments
  living in ~/empresa-prueba.
estimated_minutes: 7
sandbox: empresa-prueba
mental_model: >
  Don't talk to Claude like you talk to a search engine. Talk to it
  like you'd talk to a sharp intern who just walked in. Context,
  goal, tone.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: leer-departamento
    title: Ask Claude to read a department
    body: >
      Claude Code is in front of you, already open in the Empresa
      Prueba folder. First trick: when you ask for something, tell
      it WHERE to look and WHAT you want back. Here you ask it to
      read the 01-ventas folder and answer in three sentences.
    prompt: |
      Read the 01-ventas folder and tell me in three sentences
      what this department does.
    hint: >
      Trick: "three sentences" is a clear goal. Without that hint,
      Claude can drop two paragraphs on you. With it, it adjusts.
    xp: 10
    expected_response_seconds: 25
    voice_first: true
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "01-ventas"
    success_title: "Nice. Claude read the department"
    success_sub: "You earned 10 XP. Move to step 2 and learn how to correct it."
    role_variants:
      ventas:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          your department (01-ventas) and answer in three
          sentences. Tell it WHERE to look and WHAT you want.
        prompt: |
          Read the 01-ventas folder and tell me in three sentences
          what this department does.
        hint: >
          Numbers first in sales: pipeline, cycle, conversion.
          "Three sentences" forces it to go to the point.
      marketing:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          02-marketing and answer in three sentences. Data, not
          opinions.
        prompt: |
          Read the 02-marketing folder and tell me in three
          sentences what this department does.
      tecnologia:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          03-tecnologia and answer in three sentences with explicit
          trade offs.
        prompt: |
          Read the 03-tecnologia folder and tell me in three
          sentences what this department does and what trade offs
          it has today.
      producto:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          04-producto and answer in three sentences focused on the
          problems it addresses, not the solutions.
        prompt: |
          Read the 04-producto folder and tell me in three sentences
          which problems this department addresses.
      finanzas:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          05-finanzas and answer in three sentences with numbers
          and deadlines.
        prompt: |
          Read the 05-finanzas folder and tell me in three sentences
          what this department does. Numbers before words.
      rrhh:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          06-rrhh and answer in three sentences. People before
          process.
        prompt: |
          Read the 06-rrhh folder and tell me in three sentences
          what this department does.
      legal:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          07-legal and answer in three sentences with the open
          risks first.
        prompt: |
          Read the 07-legal folder and tell me in three sentences
          what this department does and which risks are open.
      estrategia:
        body: >
          Claude Code is open in Empresa Prueba. Ask it to read
          08-estrategia and answer in three sentences, long horizon,
          reversible decisions where possible.
        prompt: |
          Read the 08-estrategia folder and tell me in three
          sentences what this department does.

  - id: corregir-sobre-la-marcha
    title: Now ask for shorter
    body: >
      If the answer is too long or the tone isn't right, you don't
      have to start over. You tell Claude and it adjusts on the
      same conversation.
    prompt: |
      too long, make it two sentences and an informal tone
    hint: >
      Trick: the more specific the correction, the better.
      "Shorter" works. "Two sentences, informal tone, no bullet
      points" works even better.
    xp: 10
    expected_response_seconds: 20
    voice_first: true
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(two\\s+sentences|shorter|informal)"
    success_title: "Nice. You corrected without restarting"
    success_sub: "You earned 10 XP. Move to step 3 to ask for something more ambitious."
    role_variants:
      ventas:
        body: >
          Correct on the fly. Ask for two sentences, informal tone.
          Adjust without starting over.
        prompt: |
          too long, make it two sentences and an informal tone
      marketing:
        body: >
          Correct on the fly. Ask for two direct sentences, informal
          tone, no jargon or superlatives.
        prompt: |
          too long, two sentences, informal, no jargon
      tecnologia:
        body: >
          Correct on the fly. Ask for two sentences with the most
          important trade off explicit.
        prompt: |
          too long, two sentences, state the main trade off
      producto:
        body: >
          Correct on the fly. Ask for two sentences focused on the
          biggest problem, not on features.
        prompt: |
          too long, two sentences, lead with the most urgent problem
      finanzas:
        body: >
          Correct on the fly. Ask for two sentences with the key
          number first.
        prompt: |
          too long, two sentences, key number first
      rrhh:
        body: >
          Correct on the fly. Ask for two sentences focused on
          people impact.
        prompt: |
          too long, two sentences, lead with people impact
      legal:
        body: >
          Correct on the fly. Ask for two sentences with the main
          risk first.
        prompt: |
          too long, two sentences, main risk first
      estrategia:
        body: >
          Correct on the fly. Ask for two sentences with the most
          reversible decision highlighted.
        prompt: |
          too long, two sentences, highlight the reversible decision

  - id: pedir-algo-ambicioso
    title: Ask for something more ambitious
    body: >
      Claude isn't just for short questions. Ask for a real
      deliverable: a one-page summary of the department's status.
      You'll see it open several files in a row to compose the
      answer.
    prompt: |
      Prepare a one-page summary of the sales department's
      status. Pipeline, quarterly priorities, and two risks.
    hint: >
      Trick: when you ask for something big, tell it the structure
      you want. "Pipeline, priorities, risks" gives Claude the
      skeleton and stops it from inventing one.
    xp: 10
    expected_response_seconds: 90
    voice_first: true
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(summary|status).{0,40}(sales|ventas|marketing|tech|product|finance|hr|legal|strategy|department)"
    success_title: "Nice. You asked for a real deliverable"
    success_sub: "You earned 10 XP. Last step: see what happens when info is missing."
    role_variants:
      ventas:
        body: >
          Ask for a one-page summary of the sales state. Pipeline,
          quarterly priorities, and two risks.
        prompt: |
          Prepare a one-page summary of the sales department's
          status. Pipeline, quarterly priorities, and two risks.
      marketing:
        body: >
          Ask for a one-page summary of the marketing state. Funnel,
          active campaigns, and two risks.
        prompt: |
          Prepare a one-page summary of the marketing department's
          status. Funnel, active campaigns, and two risks.
      tecnologia:
        body: >
          Ask for a one-page summary of the tech state. SLOs,
          deploys, and two tech risks.
        prompt: |
          Prepare a one-page summary of the tech department's
          status. SLOs, deploys, and two risks.
      producto:
        body: >
          Ask for a one-page summary of product state. Initiatives,
          adoption, and two risks.
        prompt: |
          Prepare a one-page summary of the product department's
          status. Initiatives, adoption, and two risks.
      finanzas:
        body: >
          Ask for a one-page summary of finance state. ARR, burn,
          and two risks.
        prompt: |
          Prepare a one-page summary of the finance department's
          status. ARR, burn, and two risks.
      rrhh:
        body: >
          Ask for a one-page summary of HR state. Headcount, open
          roles, and two risks.
        prompt: |
          Prepare a one-page summary of the HR department's status.
          Headcount, open roles, and two risks.
      legal:
        body: >
          Ask for a one-page summary of legal state. Contracts in
          flight, compliance, and two risks.
        prompt: |
          Prepare a one-page summary of the legal department's
          status. Contracts, compliance, and two risks.
      estrategia:
        body: >
          Ask for a one-page summary of strategy state. Plan,
          partnerships, and two risks.
        prompt: |
          Prepare a one-page summary of the strategy department's
          status. Plan, partnerships, and two risks.

  - id: pregunta-sin-datos
    title: Ask for something Claude CAN'T know
    body: >
      One of the most valuable things about Claude Code is that
      when it doesn't have the data, it says so. It doesn't make
      things up. Let's trigger that case on purpose so you see it.
    prompt: |
      how many customers do we have in Madrid?
    hint: >
      Trick: if Claude answers with a made-up number, stop it and
      say "don't make things up, tell me what you'd need to know
      this". That trains the habit of not accepting unsourced data.
    xp: 10
    expected_response_seconds: 30
    voice_first: true
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(how\\s+many|customers|mqls|latency|adoption|dso|enps|contracts|probability).{0,60}(madrid|region|quarter|top|expire|close|series)"
    success_title: "Nice. You just learned how to trust Claude"
    success_sub: "You earned 10 XP. You've finished your first conversation."
    role_variants:
      ventas:
        body: >
          Ask something it can't know: how many customers you have
          in Madrid. It should say "I don't have a source".
        prompt: |
          how many customers do we have in Madrid?
      marketing:
        body: >
          Ask something it can't know: how many MQLs came from
          Madrid last quarter.
        prompt: |
          how many MQLs came from Madrid last quarter?
      tecnologia:
        body: >
          Ask something it can't know: p99 latency per region right
          now.
        prompt: |
          what is the p99 latency per region right now?
      producto:
        body: >
          Ask something it can't know: adoption of the latest
          feature in mid market.
        prompt: |
          what is the adoption of the latest feature in mid market?
      finanzas:
        body: >
          Ask something it can't know: DSO per top customer this
          week.
        prompt: |
          what is the DSO per top customer this week?
      rrhh:
        body: >
          Ask something it can't know: ENPS per department in the
          last cycle.
        prompt: |
          what is the ENPS per department in the last cycle?
      legal:
        body: >
          Ask something it can't know: how many contracts expire in
          Q3 with our top customers.
        prompt: |
          how many contracts expire in Q3 with our top customers?
      estrategia:
        body: >
          Ask something it can't know: real probability of closing
          Series A in Q2.
        prompt: |
          what is the real probability of closing Series A in Q2?

on_complete:
  total_xp: 40
  takeaways:
    - Talk to Claude with context, goal, and tone.
    - Correct on the fly without starting over.
    - Claude tells you when it lacks data, it doesn't invent.
  next_module: m3-organizar-cabeza
  trigger_signup: true
