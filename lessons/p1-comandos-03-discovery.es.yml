# Fase 2, Pilar 1 Comandos, Leccion 3. Version ES.
#
# Comandos de exploracion: /init (crear CLAUDE.md inicial), /agents (ver
# subagentes), /status (ver estado y ventana de contexto). Cierre del
# pilar: mascado todavia alto porque son atajos de nombre cerrado, pero
# ya sin explicar la mecanica.
#
# Predicados:
#   - claude_slash_command: { command: init }
#   - claude_slash_command: { command: agents }
#   - claude_slash_command: { command: status }
#   - claude_prompt_sent:   { match_regex }

id: p1-comandos-03-discovery
module_number: 103
language: es
title: Los tres comandos de descubrimiento
subtitle: /init, /agents y /status. Conoce tu proyecto, tu equipo y tu estado
description: >
  Tres slash commands que todo el mundo usa tarde o temprano.
  /init escanea la carpeta y te propone un CLAUDE.md inicial para
  que Claude te recuerde sin preguntarte. /agents lista los
  subagentes especialistas. /status te muestra modelo, carpeta y
  ventana de contexto. Son el "orientate en un proyecto nuevo" en
  treinta segundos.
estimated_minutes: 5
sandbox: empresa-prueba
mental_model: >
  Los slash de discovery son las tres preguntas que le haces a un
  recien llegado: "que proyecto es este", "quienes estan en el
  equipo", "que tal va todo". Respuestas en una pantalla.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: slash-init
    title: Arranca /init para generar CLAUDE.md
    body: >
      /init hace que Claude mire tu carpeta, infiera de que va y
      te proponga un CLAUDE.md de arranque. No es definitivo; es
      un borrador que vas a ajustar. Ahorra diez minutos de folio
      en blanco.
    prompt: |
      /init
    hint: >
      Truco: /init se ejecuta una vez por proyecto. Si despues
      ajustas a mano (lo haras), no tienes que volver a correrlo.
    xp: 10
    expected_response_seconds: 45
    success:
      type: claude_slash_command
      match:
        command: init
    success_title: "Bien. Tienes un CLAUDE.md de arranque"
    success_sub: "Ganas 10 XP. Lo tocaras a mano en Pilar 2, no hace falta que sea perfecto hoy."

  - id: slash-agents
    title: Comprueba los subagentes con /agents
    body: >
      /agents abre el menu de subagentes: especialistas que Claude
      puede invocar segun la tarea. Hoy esta vacio. Es informativo,
      solo para que sepas donde mirar cuando hablemos de delegacion.
    prompt: |
      /agents
    hint: >
      Truco: /agents se usa mas adelante para crear y editar
      subagentes. Hoy solo miramos la estanteria.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: agents
    success_title: "Bien. Has visto donde viven los subagentes"
    success_sub: "Ganas 10 XP. Vamos al tercero."

  - id: slash-status
    title: Mira tu estado con /status
    body: >
      /status te dice modelo, carpeta de trabajo, configuracion y,
      lo mas importante, la ventana de contexto: cuanto espacio
      has consumido en esta conversacion. Es la foto del panel
      de instrumentos.
    prompt: |
      /status
    hint: >
      Truco: fijate en el porcentaje de contexto. Ese numero
      protagoniza el Pilar 2 entero. Memoriza donde sale.
    xp: 10
    expected_response_seconds: 15
    success:
      type: claude_slash_command
      match:
        command: status
    success_title: "Bien. Has visto tu panel de instrumentos"
    success_sub: "Ganas 10 XP. Pilar 1 cerrado. Empiezas Pilar 2 entendiendo ese contador de contexto."

on_complete:
  total_xp: 30
  takeaways:
    - /init propone un CLAUDE.md de arranque escaneando la carpeta.
    - /agents lista los subagentes disponibles en el proyecto.
    - /status muestra modelo, carpeta y contexto consumido.
  next_module: p2-contexto-01-ventana
