# Module 8, Your AI-native life. EN version.

id: m8-vida-ai-native
module_number: 8
language: en
title: Your AI-native life
subtitle: When working with Claude stops being novel and becomes normal
description: >
  Course closer. We review the seven modules as habits, not commands,
  and leave a personal manifesto in mi-trabajo with three rules the
  user takes to real work.
estimated_minutes: 7
sandbox: empresa-prueba
mental_model: >
  AI-native isn't using AI. It's designing your work assuming it's
  there. You no longer use AI, you live alongside it.

preconditions:
  working_directory: /home/learner/empresa-prueba/mi-trabajo
  claude_running: true

steps:

  - id: balance-de-modulos
    title: Ask Claude for the course balance
    body: >
      Before closing, look at what you've done. Subagents, skills,
      CLAUDE.md, MCPs, daily routine.
    prompt: |
      look at my mi-trabajo folder (CLAUDE.md, agents, skills, mcps)
      and give me a map of what I have active, what I use little,
      and what I haven't touched yet. Honest, no sugarcoat.
    hint: >
      Trick: good prompt to repeat every month and see how your
      setup grows.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_tool_call
      match:
        tool: Read
        path_regex: "mi-trabajo"
    success_title: "Nice. You have the map of your setup"
    success_sub: "You earned 10 XP. Now to the key question."

  - id: la-pregunta-diaria
    title: The question you'll carry with you
    body: >
      Every time you start a task, one question: "do I have to do
      this myself?". If no, Claude. If yes, Claude alongside.
    prompt: |
      frame this sentence as a short desk reminder: "do I have to
      do this myself?". Make it memorable, no corny.
    hint: >
      Trick: this question is worth more than the hundred skills
      you could save.
    xp: 10
    expected_response_seconds: 30
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(do\\s+I|myself|reminder|question)"
    success_title: "Nice. You have the question"
    success_sub: "You earned 10 XP. Let's write it down."

  - id: manifiesto-personal
    title: Write your manifesto in three rules
    body: >
      Close with a manifiesto.md in mi-trabajo. Three rules of
      your own. What you'll do tomorrow when you open the laptop,
      what you'll stop doing, what decision Claude takes for you.
    prompt: |
      create a manifiesto.md in mi-trabajo with three of my rules:
      1) what I'll do tomorrow when I open the laptop,
      2) what I'll stop doing,
      3) which decision I let you take on your own and which I
      don't.
    hint: >
      Trick: the manifesto grows. Three lines today, ten in six
      months.
    xp: 10
    expected_response_seconds: 90
    success:
      type: file_exists
      match:
        path: /home/learner/empresa-prueba/mi-trabajo/manifiesto.md
    success_title: "Nice. Manifesto saved"
    success_sub: "You earned 10 XP. Last step."
    role_variants:
      ventas:
        body: In sales, rule one is usually "open Claude before the CRM".
      marketing:
        body: In marketing, "no content ships without Claude seeing it".
      tecnologia:
        body: In tech, "explicit trade off before any decision".
      producto:
        body: In product, "problem before solution".
      finanzas:
        body: In finance, "number first, never estimate".
      rrhh:
        body: In HR, "listen before process".
      legal:
        body: In legal, "risk first, caution by default".
      estrategia:
        body: In strategy, "reversible decision before perfect".

  - id: cierre-y-traslado
    title: Take it to real work
    body: >
      The sandbox was a fictional company. What you learned works
      as-is in real work.
    prompt: |
      write me a three-paragraph email to next-Monday me, reminding
      what to open first, which skill to run, and why the sandbox
      was just rehearsal.
    hint: >
      Trick: this is the last prompt you send in the sandbox.
      Paste it to Monday in your real calendar when you leave.
    xp: 10
    expected_response_seconds: 60
    success:
      type: claude_prompt_sent
      match_regex: "(?i)(email|monday|reminder)"
    success_title: "Nice. Course complete"
    success_sub: "You earned 10 XP. You know Claude Code. Welcome to the other side."

on_complete:
  total_xp: 40
  takeaways:
    - Week 1, friction. Month 1, routine. Quarter, leverage.
    - "Daily question: do I have to do this myself?"
    - The manifesto grows, you tune it with use.
    - Sandbox was the rehearsal. Next Monday is opening night.
  next_module: null
  course_complete: true
  trigger_signup: false
