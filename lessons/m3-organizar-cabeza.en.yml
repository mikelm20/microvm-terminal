# Module 3, Organize your head. EN version.

id: m3-organizar-cabeza
module_number: 3
language: en
title: Organize your head
subtitle: A folder for your work and a CLAUDE.md file that tells Claude who you are
description: >
  Create the mi-trabajo folder inside Empresa Prueba with four
  subfolders (people, projects, companies, archive) and a CLAUDE.md
  file at the root that Claude Code will read automatically every
  time you open a conversation in that folder.
estimated_minutes: 8
sandbox: empresa-prueba
mental_model: >
  Claude is the new chief of staff. Before you ask for anything,
  leave a folder on the desk with your stuff and a sheet that says
  "this is me". From then on it works on its own.

preconditions:
  working_directory: /home/learner/empresa-prueba
  claude_running: true

steps:

  - id: crear-carpeta-raiz
    title: Create your work folder
    body: >
      Everything you put here, Claude sees. Anything you don't, it
      doesn't know about. Start with a folder called mi-trabajo at
      the root of Empresa Prueba.
    prompt: |
      create a folder called mi-trabajo at the root
    hint: >
      Trick: asking in plain language is enough. Claude translates
      it to mkdir. You don't have to learn commands.
    xp: 10
    expected_response_seconds: 20
    success:
      type: claude_tool_call
      match:
        tool: Bash
        command_regex: "mkdir.*mi-trabajo"
    success_title: "Nice. You have your folder"
    success_sub: "You earned 10 XP. Now split it in four, like you split your head."

  - id: subcarpetas
    title: Create the four subfolders
    body: >
      People, projects, companies, archive. That split works for
      most people. You can rearrange later, with use. Don't
      overthink it today.
    prompt: |
      now create four subfolders inside: 01-personas,
      02-proyectos, 03-empresas and 04-archivo
    hint: >
      Trick: names with a numeric prefix. They always come out in
      the same order and the brain gets used to it.
    xp: 10
    expected_response_seconds: 25
    success:
      type: claude_tool_call
      match:
        tool: Bash
        command_regex: "01-personas.*02-proyectos.*03-empresas.*04-archivo"
    success_title: "Nice. Your structure is in place"
    success_sub: "You earned 10 XP. Last step: give Claude your intro sheet."

  - id: crear-claude-md
    title: Give it a sheet that says who you are
    body: >
      A file called CLAUDE.md at the root of mi-trabajo. Claude
      reads it automatically every time you open a conversation
      from that folder. So you don't have to repeat yourself.
      Three paragraphs is plenty, no biography.
    prompt: |
      create a CLAUDE.md at the root of mi-trabajo. Write that I
      work at Empresa Prueba, that I prefer short answers in
      English without long bullet lists, and that my priorities
      today are closing the quarter and prepping the board meeting.
    hint: >
      Trick: what you write today is ten lines. In a month it will
      be thirty. It grows with use. You don't nail it on day one.
    xp: 10
    expected_response_seconds: 40
    success:
      type: file_contents_regex
      match:
        path: /home/learner/empresa-prueba/mi-trabajo/CLAUDE.md
        regex: "(?is)(empresa|priorities|short\\s+answers|prioridades)"
    success_title: "Nice. Claude knows who you are"
    success_sub: "You earned 10 XP. Try /memory inside Claude to see what it's loading."
    role_variants:
      ventas:
        body: >
          CLAUDE.md in mi-trabajo. Say you run sales at Empresa
          Prueba, you work with numbers (pipeline, cycle, win
          rate) and this quarter you close the Q and prep Acme.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run sales at Empresa Prueba, I prefer short answers in
          English with numbers first, and my priorities are
          closing the quarter and the Acme proposal.
      marketing:
        body: >
          CLAUDE.md in mi-trabajo. Say you run marketing, you work
          with data and you prioritize vertical campaign and
          community retention.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run marketing, I prefer short answers in English with
          data first, my priorities are vertical campaign and
          retention.
      tecnologia:
        body: >
          CLAUDE.md in mi-trabajo. Say you run tech, you work with
          explicit trade offs and you prioritize auth migration
          and p99 SLO.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run tech, prefer short answers in English with explicit
          trade offs, priorities are auth migration and p99 SLO.
      producto:
        body: >
          CLAUDE.md in mi-trabajo. Say you run product, you work
          problem-first and you prioritize CSV export and SSO.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run product, prefer short answers in English problem
          first, priorities are CSV export and SSO.
      finanzas:
        body: >
          CLAUDE.md in mi-trabajo. Say you run finance, you work
          with numbers and deadlines, priorities are Q close and
          lower DSO.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run finance, prefer short answers in English number
          first, priorities are Q close and lower DSO.
      rrhh:
        body: >
          CLAUDE.md in mi-trabajo. Say you run HR, people before
          process, priorities are cover senior eng and close
          reviews.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run HR, prefer short answers in English people first,
          priorities are cover senior eng and close reviews.
      legal:
        body: >
          CLAUDE.md in mi-trabajo. Say you run legal, caution by
          default, priorities are strategic NDAs and vendor DPAs.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run legal, prefer short answers in English risk first,
          priorities are strategic NDAs and vendor DPAs.
      estrategia:
        body: >
          CLAUDE.md in mi-trabajo. Say you run strategy, long
          horizon and optionality, priorities are Mexico decision
          and Series A round.
        prompt: |
          create a CLAUDE.md at the root of mi-trabajo. Write that
          I run strategy, prefer short answers in English with
          reversible options, priorities are Mexico decision and
          Series A.

  - id: probar-la-memoria
    title: Check Claude read it
    body: >
      To verify CLAUDE.md is in use, ask something Claude can only
      know from that file. If it answers with your priorities
      without you telling it, all good.
    prompt: |
      without opening anything, tell me what my priorities today are
    hint: >
      Trick: the /memory command inside Claude shows all CLAUDE.md
      files it is loading right now, and from where. Useful when
      something doesn't add up.
    xp: 10
    expected_response_seconds: 20
    success:
      type: claude_prompt_sent
      match_regex: "(?i)priorit"
    success_title: "Nice. Your brain is out of your head"
    success_sub: "You earned 10 XP. Module 3 closed."

on_complete:
  total_xp: 40
  takeaways:
    - A root folder for your work and four clear subfolders.
    - CLAUDE.md at the root, Claude reads it automatically.
    - /memory shows you what it's loading right now.
    - The file grows with use, you don't nail it on day one.
  next_module: m4-dia-a-dia
  trigger_signup: false
