# Capstone builder lesson. Version ES.
#
# Used by the /capstone/build endpoint. The control plane spins up a VM,
# primes claude-wrap with this `system_prompt` via --system-prompt-file,
# and then submits the learner's brief wrapped with the prompt injection
# template defined in lab-capstone.injection.md. Claude writes files into
# /home/learner/app/ and launches `python3 -m http.server 3000`. The
# guest-agent emits `port_listening:3000`, at which point the control
# plane requests a files snapshot and the frontend mounts the iframe
# against /sessions/:id/preview/3000/.
#
# Pairs with: lab-capstone.en.yml, lab-capstone.injection.md.
id: lab-capstone
module_number: 9002
language: es
title: Capstone del Lab
subtitle: Claude construye tu primera mini-app
description: >
  Cierre del Claude Code Lab. El aprendiz escribe un brief corto y Claude
  le construye una mini-app visual de una sola pagina.
estimated_minutes: 2
sandbox: app

preconditions:
  working_directory: /home/learner/app
  claude_running: true

steps:
  - id: build
    title: Construir mini-app
    body: >
      Claude construye la mini-app que describiste. Cuando el puerto 3000
      este escuchando, la app se carga aqui al lado.
    xp: 100
    expected_response_seconds: 60
    success:
      type: port_listening
      match:
        port: 3000
    success_title: "Tu mini-app esta lista"
    success_sub: "Has construido tu primera app con Claude Code."
    system_prompt: |
      Estas dentro de una VM efimera en el Claude Code Lab de
      learn.example.com. El usuario es un aprendiz. Acaba de validar un
      brief corto para construirte una mini-app visual educativa. Tu tarea:
      construir esa mini-app ahora.

      CONTEXTO TECNICO FIJO (no cambies nada de esto):
      - Directorio de trabajo: /home/learner/app/ (cd ahi; mkdir -p si hace falta).
      - Stack: HTML + CSS + JavaScript vanilla. NO uses React, Vue, Next,
        Vite, npm, webpack, typescript. Solo index.html, styles.css y app.js.
      - Serve: al terminar de escribir los archivos, arranca python3 -m
        http.server 3000 desde /home/learner/app/ en foreground. python3 ya
        esta instalado.
      - Puerto OBLIGATORIO: 3000. No uses otro puerto.
      - NO uses fetch, XMLHttpRequest, websockets, ni ninguna URL externa.
        Datasets deben estar inline en el JS.
      - NO uses CDNs (ni Chart.js ni D3 ni Tailwind via CDN). Todo el CSS
        y JS va inline en los tres archivos locales.
      - NO pidas permisos, NO toques archivos fuera de /home/learner/app/.
      - NO uses nohup ni background; el servidor debe correr en foreground
        para que la deteccion de puerto funcione.

      REGLAS DE PRODUCTO:
      - Una sola pagina, responsive (mobile-first), funciona sin recarga.
      - Accesible: labels visibles, focus states, contrast ratio minimo AA.
      - Minimalista: tipografia del sistema, paleta calida (fondo crema
        #f5e8d0, naranja #d65a10 como accent, tinta oscura #1a1a1a). Nada
        de gradientes agresivos, nada de shadows exageradas.
      - Si el brief pide algo ambiguo, elige la interpretacion mas educativa
        y visual.
      - Anade un header minimo con el titulo de la mini-app.

      FLUJO ESPERADO:
      1. Crea /home/learner/app/index.html con el HTML (referencia styles.css
         y app.js por rutas relativas, NO absolutas).
      2. Crea /home/learner/app/styles.css.
      3. Crea /home/learner/app/app.js con la logica y datasets inline.
      4. Abre un shell y ejecuta: cd /home/learner/app && python3 -m http.server 3000
      5. Deja el servidor corriendo en foreground.

      Cuando el puerto 3000 este escuchando, el sistema detecta la app y la
      muestra al aprendiz. No escribas explicaciones largas, solo una o dos
      frases describiendo lo que hiciste.

on_complete:
  total_xp: 100
  takeaways:
    - Claude Code puede construir, no solo responder.
    - Un brief corto bien encuadrado rinde mas que uno largo disperso.
  next_module: null
  course_complete: false
